<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Promark Logo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            border: 2px dashed #ccc;
            padding: 30px;
            text-align: center;
        }
        img {
            max-width: 100%;
            border: 1px solid #ddd;
            margin: 20px 0;
        }
        .instructions {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            text-align: left;
        }
        button {
            background: #0052A3;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #003d7a;
        }
        #drop-zone {
            border: 3px dashed #0052A3;
            padding: 40px;
            margin: 20px 0;
            border-radius: 10px;
        }
        #drop-zone.dragover {
            background: #e3f2fd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Promark Logo Setup</h1>
        
        <div class="instructions">
            <h3>Instructions:</h3>
            <ol>
                <li>Drag and drop the Promark logo image below, OR</li>
                <li>Click "Choose File" to select the logo</li>
                <li>Preview the logo to verify it's correct</li>
                <li>Click "Save Logo" to save it as <code>promark-logo.png</code></li>
            </ol>
        </div>

        <div id="drop-zone">
            <p>Drag and drop the Promark logo image here</p>
            <p>or</p>
            <input type="file" id="fileInput" accept="image/png,image/jpeg" />
        </div>

        <div id="preview-container" style="display:none;">
            <h3>Logo Preview:</h3>
            <img id="preview" alt="Logo preview" />
            <br>
            <button id="saveBtn">Save as promark-logo.png</button>
        </div>

        <div id="status"></div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const previewContainer = document.getElementById('preview-container');
        const saveBtn = document.getElementById('saveBtn');
        const status = document.getElementById('status');
        let currentFile = null;

        // Drag and drop handlers
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // File input handler
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('Please select an image file');
                return;
            }

            currentFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                previewContainer.style.display = 'block';
                status.textContent = '';
            };
            reader.readAsDataURL(file);
        }

        saveBtn.addEventListener('click', () => {
            if (!currentFile) return;

            // Create download link
            const url = URL.createObjectURL(currentFile);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'promark-logo.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            status.innerHTML = '<p style="color: green; font-weight: bold;">✓ Logo downloaded! Please move the file to: <code>/public/assets/images/promark-logo.png</code></p>';
        });
    </script>
</body>
</html>
